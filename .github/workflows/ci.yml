name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Repository checks
        run: |
          git diff --check
          sh -n build-app.sh

      - name: Unit tests
        run: swift test

      - name: Build Universal app
        run: ./build-app.sh

      - name: Package DMG
        run: ./scripts/package-dmg.sh ci

      - name: Verify bundle
        run: |
          codesign --verify --strict --verbose=2 "dist/Meterline.app"
          test -f "dist/Meterline.app/Contents/Resources/AppIcon.icns"
          test "$(lipo -archs 'dist/Meterline.app/Contents/MacOS/Meterline')" = "x86_64 arm64" || \
            test "$(lipo -archs 'dist/Meterline.app/Contents/MacOS/Meterline')" = "arm64 x86_64"
          xcrun vtool -show-build "dist/Meterline.app/Contents/MacOS/Meterline"
