name: Bug report
description: Report a reproducible problem in Meterline
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, cookies, credentials, complete provider responses, or session files. Synthetic or redacted usage fields are sufficient.
  - type: input
    id: app-version
    attributes:
      label: Meterline version or commit
      description: Include whether this is a source build.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source ID and region
      placeholder: minimax-global, Cursor local, custom HTTPS
    validations:
      required: true
  - type: input
    id: authentication
    attributes:
      label: Authentication method
      description: Method and permission scope only; never include credential values.
      placeholder: Current CLI, independent OAuth file, API key, admin key, cookie, device login
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 14.6, MacBook Pro 14-inch (M2 Pro)
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Relevant CLI or external tool version (if applicable)
      description: Include Codex, Claude Code, Kiro, Magpie or CC Switch version when relevant.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Redacted logs or screenshots only.
